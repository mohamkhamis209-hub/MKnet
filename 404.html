<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 - الصفحة غير موجودة | MKnet</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg: #070a10;
    --surface: #0e1526;
    --text: #f1f5f9;
    --accent: #38bdf8;
    --line: #1e293b;
  }
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 420px;
    margin: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .logo {
    width: 64px;
    height: 64px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 12px;
    color: var(--accent);
  }
  p {
    font-size: 15px;
    opacity: 0.8;
    line-height: 1.6;
    margin: 0 0 24px;
  }
  .btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 12px;
    background: var(--accent);
    color: #070a10;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    opacity: 0.95;
  }
</style>
<script>
  // GitHub Pages SPA router redirect: if someone directly enters a subpath, redirect to index.html with hash
  const path = window.location.pathname;
  const segments = path.split("/").filter(Boolean);
  // If in a GitHub repo subfolder (e.g. /my-repo/overview), keep repo segment and send to index.html
  const repoName = segments.length > 0 && segments[0] !== "index.html" ? segments[0] : "";
  setTimeout(function() {
    window.location.replace("./index.html");
  }, 3500);
</script>
</head>
<body>
  <div class="card">
    <img src="logo.svg" alt="MKnet" class="logo">
    <h1>الصفحة غير موجودة (404)</h1>
    <p>لم يتم العثور على المسار المطلوب. سيتم تحويلك إلى لوحة تحكم MKnet الرئيسية تلقائيًا خلال لحظات...</p>
    <a href="./index.html" class="btn">العودة للرئيسية الآن</a>
  </div>
</body>
</html>
